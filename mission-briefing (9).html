<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Briefing Console</title>
<style>
:root{--bg:#0c1210;--panel:#101a16;--line:#2c4a3c;--ink:#cfe8d9;--dim:#6f9482;--trace:#5dffa0;--btn:#183026;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--bar,#0a0f0d);border-bottom:1px solid var(--line);align-items:center}
#bar.hidden{display:none}
button,label.b{background:var(--btn);color:var(--ink);border:1px solid var(--line);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;border-radius:3px}
button:hover,label.b:hover{border-color:var(--trace)}
button:focus-visible,label.b:focus-within{outline:2px solid var(--trace)}
label.b input[type=file]{position:absolute;opacity:0;width:0;height:0}
label.b{position:relative}
#bar .sp{flex:1}
#bar small{color:var(--dim)}
#stage{flex:1;min-height:0;display:grid;gap:10px;padding:10px;
grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);
grid-template-areas:"b1 b3" "b2 b3"}
#stage.four{grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"b1 b4" "b2 b3"}
#stage.four{grid-template-rows:minmax(0,1.2fr) minmax(0,1.8fr)}
.box{position:relative;background:var(--panel);border:1px solid var(--line);overflow:hidden;min-width:0;min-height:0;border-radius:0}
#b1{grid-area:b1}#b2{grid-area:b2}#b3{grid-area:b3}#b4{grid-area:b4;display:none}
#stage.four #b4{display:block}
.box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.box.has img{display:block}
#b1 img{object-fit:cover}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:13px;padding:12px;cursor:pointer}
.box.has .ph{display:none}
.dim{position:absolute;inset:0;background:#000;opacity:.8;pointer-events:none;z-index:1}
.tag{z-index:2;position:absolute;left:0;bottom:0;right:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:15px;letter-spacing:.02em;display:none}
.box.has .tag:not(:empty){display:block}
.cnt{position:absolute;top:6px;right:8px;font-size:12px;background:rgba(0,0,0,.6);padding:2px 6px;display:none}
.box.multi .cnt{display:block}
.grp{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.grp[hidden]{display:none}
.grp input[type=range]{width:90px;vertical-align:middle}
.crtfx #b1::after,.crtfx #b2::after,.crtfx #b4::after,.bevel #b1::after,.bevel #b2::after,.bevel #b4::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
background:var(--glare,linear-gradient(transparent,transparent)),var(--lines,linear-gradient(transparent,transparent)),var(--vig,linear-gradient(transparent,transparent))}
.crtfx{--lines:repeating-linear-gradient(to bottom,rgba(0,0,0,var(--crt,.35)) 0,rgba(0,0,0,var(--crt,.35)) 2px,transparent 2px,transparent 4px);--vig:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.4) 100%)}
.bevel{--glare:linear-gradient(135deg,rgba(255,255,255,.12),transparent 32%)}
.bevel #b1,.bevel #b2,.bevel #b4{border:9px solid;border-color:#4a5256 #232829 #15181a #3a4144;border-radius:26px;box-shadow:0 3px 8px rgba(0,0,0,.6)}
.bevel #b1::after,.bevel #b2::after,.bevel #b4::after{border-radius:17px;box-shadow:inset 0 0 0 2px #050606,inset 0 0 36px rgba(0,0,0,.55)}
.crtfx #b1::before,.crtfx #b2::before,.crtfx #b4::before{content:"";position:absolute;left:0;right:0;top:0;height:25%;pointer-events:none;z-index:4;
background:linear-gradient(to bottom,transparent,rgba(255,255,255,.07),transparent);animation:roll 6s linear infinite}
@keyframes roll{from{transform:translateY(-100%)}to{transform:translateY(400%)}}
@media (prefers-reduced-motion:reduce){.crtfx .box::before{animation:none!important;display:none}}
.coin{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
.box.spin.has .coin{display:block}
.box.spin img{display:none!important}
.box.drag{border-color:var(--trace)}
#scope{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--scopebg,#050a07)}
#status{position:absolute;left:10px;top:8px;font-size:12px;color:var(--dim);pointer-events:none}
input.nm{background:var(--bar,#0a0f0d);color:var(--ink);border:1px solid var(--line);padding:5px 8px;font:inherit;font-size:13px;width:140px}
@media (max-aspect-ratio:1/1){
#stage{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1.6fr);grid-template-areas:"b1 b2" "b3 b3"}
#stage.four{grid-template-rows:minmax(0,1fr) minmax(0,.8fr) minmax(0,1.2fr);grid-template-areas:"b1 b2" "b4 b4" "b3 b3"}}
</style>
</head>
<body>
<div id="bar">
  <label class="b">Portrait A<input type="file" accept="image/*" data-slot="b1"></label>
  <label class="b">Portrait B<input type="file" accept="image/*" id="pb"></label>
  <label class="b">Logo / images<input type="file" accept="image/*" multiple data-slot="b2"></label>
  <label class="b">Extra window<input type="file" accept="image/*" multiple data-slot="b4"></label>
  <label class="b">Voice file<input type="file" accept="audio/*" id="aud"></label>
  <button id="play" disabled>Play</button>
  <button id="exm">Export frame: match screen</button>
  <button id="rec" disabled>Export video</button>
  <button id="spin2" aria-pressed="false">Spin box 2</button>
  <button id="spin4" aria-pressed="false">Spin box 4</button>
  <button id="circ" aria-pressed="true">Circle box 2: on</button>
  <span id="cctl" class="grp">
    <button id="fitb">Crop to fill</button>
    <span id="fillctl" class="grp"><label>Zoom <input type="range" id="zm" min="1" max="3" step="0.01" value="1"></label>
    <label>Left/right <input type="range" id="ox" min="-1" max="1" step="0.01" value="0"></label>
    <label>Up/down <input type="range" id="oy" min="-1" max="1" step="0.01" value="0"></label></span>
    <label id="fitctl" class="grp" hidden>Fill color <input type="color" id="bgc" value="#0e0e0e"></label>
  </span>
  <button id="clean" aria-pressed="false">Clean portrait background: off</button>
  <label id="cleanctl" class="grp" hidden>Strength <input type="range" id="ct" min="5" max="120" step="1" value="40"></label>
  <label class="grp">Portrait backdrop <input type="color" id="pbg" value="#101a16"></label>
  <label class="b">Backdrop image<input type="file" accept="image/*" id="pbgimg"></label>
  <button id="pbgclr" hidden>Clear backdrop image</button>
  <button id="crtb" aria-pressed="true">CRT lines: on</button>
  <label id="crtctl" class="grp">Strength <input type="range" id="crt" min="0.1" max="0.7" step="0.01" value="0.35"></label>
  <button id="bevb" aria-pressed="true">CRT bevel: on</button>
  <span class="grp">Portrait
    <label>Zoom <input type="range" id="ppz" min="0.5" max="3" step="0.01" value="1"></label>
    <label>Left/right <input type="range" id="ppx" min="-1" max="1" step="0.01" value="0"></label>
    <label>Up/down <input type="range" id="ppy" min="-1" max="1" step="0.01" value="0"></label>
    <button id="ppr">Reset position</button></span>
  <span class="grp">Theme
    <label>Hue <input type="range" id="hue" min="0" max="360" step="1" value="147"></label>
    <label>Scope <input type="color" id="scol" value="#5dffa0"></label>
    <label>Background <input type="color" id="bcol" value="#0c1210"></label>
    <button id="thr">Reset colors</button>
    <select id="pre" aria-label="Color presets"></select>
    <input class="nm" id="prn" placeholder="Preset name" aria-label="Preset name" style="width:110px">
    <button id="prs">Save preset</button><button id="prd" hidden>Delete preset</button><span id="prm"></span></span>
  <button id="four" aria-pressed="false">Show fourth box</button>
  <input class="nm" id="nm" placeholder="Speaker A name" aria-label="Speaker A name">
  <input class="nm" id="nmb" placeholder="Speaker B name" aria-label="Speaker B name">
  <span class="grp">Conversation <button id="spkb">Speaker: A</button>
    <label>Auto every <input type="number" id="aut" min="1" max="120" value="6" style="width:60px"> s</label>
    <button id="autb" aria-pressed="false">Auto switch: off</button>
    <button id="cuer" aria-pressed="false">Record cues: off</button><button id="cuec">Clear cues</button><span id="cuen"></span></span>
  <span class="sp"></span>
  <small>H hides this bar · F fullscreen · Space plays · click a box to step through its images</small>
  <button id="fs">Fullscreen</button>
</div>
<div id="stage" class="crtfx bevel">
  <div class="box" id="b1"><img alt=""><div class="ph">Drop speaker portrait here</div><div class="dim" id="dim"></div><div class="tag" id="tag"></div></div>
  <div class="box" id="b2"><img alt=""><div class="ph">Drop faction logo or mission images</div><div class="cnt"></div><canvas class="coin"></canvas></div>
  <div class="box" id="b3"><canvas id="scope"></canvas><div id="status">No voice file loaded</div></div>
  <div class="box" id="b4"><img alt=""><div class="ph">Drop extra images here</div><div class="cnt"></div><canvas class="coin"></canvas></div>
</div>
<script>
const $=s=>document.querySelector(s);
const T={scope:'#5dffa0',bg:'#0c1210',sc:'93,255,160',panel:'#101a16',line:'#2c4a3c',scopeBg:'#050a07'};
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const toHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mixc=(a,b,t)=>{const x=hx(a),y=hx(b);return toHex(x.map((v,i)=>v+(y[i]-v)*t))};
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),
  f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return toHex([f(0)*255,f(8)*255,f(4)*255])}
function applyTheme(){
  T.sc=hx(T.scope).join(',');
  T.panel=mixc(T.bg,T.scope,.06);T.line=mixc(T.bg,T.scope,.28);T.scopeBg=mixc(T.bg,'#000000',.55);
  const r=document.documentElement.style;
  r.setProperty('--bg',T.bg);r.setProperty('--panel',T.panel);r.setProperty('--line',T.line);
  r.setProperty('--trace',T.scope);r.setProperty('--dim',mixc(T.bg,T.scope,.55));
  r.setProperty('--ink',mixc('#ffffff',T.scope,.2));r.setProperty('--btn',mixc(T.bg,T.scope,.14));
  r.setProperty('--bar',mixc(T.bg,'#000000',.35));r.setProperty('--scopebg',T.scopeBg);
  $('#scol').value=T.scope;$('#bcol').value=T.bg;
  try{localStorage.setItem('mbLast',JSON.stringify({scope:T.scope,bg:T.bg,hue:+$('#hue').value}))}catch(e){}
}
let circleOn=true,cleanOn=false,cleanT=40;
function cleanCheck(im,T){
  const k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
  const q=document.createElement('canvas');q.width=w;q.height=h;
  const g=q.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,w,h);
  const d=g.getImageData(0,0,w,h),p=d.data,cnt=new Map();
  for(let y=0;y<Math.min(48,h);y++)for(let x=0;x<Math.min(48,w);x++){
    const i=(y*w+x)*4,key=(p[i]>>3)<<10|(p[i+1]>>3)<<5|(p[i+2]>>3),e=cnt.get(key);
    if(e)e.n++;else cnt.set(key,{n:1,c:[p[i],p[i+1],p[i+2]]});
  }
  const cols=[...cnt.values()].sort((a,b)=>b.n-a.n).slice(0,2).map(e=>e.c);
  const dist=i=>{let m=1e9;for(const c of cols)m=Math.min(m,Math.abs(p[i]-c[0])+Math.abs(p[i+1]-c[1])+Math.abs(p[i+2]-c[2]));return m};
  const gone=new Uint8Array(w*h),st=new Int32Array(w*h*2);let sp=0;
  const push=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return;const n=y*w+x;if(gone[n])return;
    if(p[n*4+3]>=10&&dist(n*4)>T)return;gone[n]=1;st[sp++]=n};
  for(let x=0;x<w;x++){push(x,0);push(x,h-1)}
  for(let y=0;y<h;y++){push(0,y);push(w-1,y)}
  while(sp){const n=st[--sp],x=n%w,y=(n/w)|0;push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1)}
  const edge=[];
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const n=y*w+x;
    if(!gone[n]&&(gone[n-1]||gone[n+1]||gone[n-w]||gone[n+w])&&dist(n*4)<=T*2.2)edge.push(n)}
  for(const n of edge)gone[n]=1;
  for(let n=0;n<w*h;n++)if(gone[n])p[n*4+3]=0;
  g.putImageData(d,0,0);return q.toDataURL('image/png');
}
async function buildClean(){
  const s=slots.b1,l=s.list;
  if(!l.length)return;
  const ims=await Promise.all(l.map(loadImg));
  if(s.list!==l)return;
  s.cleans=ims.map(im=>cleanCheck(im,cleanT));show('b1');
}
let cpend=false;
function refreshClean(){
  if(!cleanOn||cpend)return;cpend=true;
  requestAnimationFrame(()=>{cpend=false;buildClean()});
}
const cp={mode:'fill',zoom:1,ox:0,oy:0,bg:'#0e0e0e'};
function loadImg(u){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u})}
function renderCircle(i){
  const m=900,q=document.createElement('canvas');q.width=q.height=m;
  const g=q.getContext('2d'),w=i.naturalWidth,h=i.naturalHeight;
  g.beginPath();g.arc(m/2,m/2,m/2,0,6.2832);g.clip();
  if(cp.mode==='fit'){
    g.fillStyle=cp.bg;g.fillRect(0,0,m,m);
    const k=m/Math.hypot(w,h);g.drawImage(i,(m-w*k)/2,(m-h*k)/2,w*k,h*k);
  }else{
    const side=Math.min(w,h)/cp.zoom;
    g.drawImage(i,(w-side)/2*(1+cp.ox),(h-side)/2*(1+cp.oy),side,side,0,0,m,m);
  }
  return q.toDataURL('image/png');
}
async function buildCirc(){
  const s=slots.b2,l=s.list,ims=await Promise.all(l.map(loadImg));
  if(s.list!==l)return;
  s.ims=ims;s.imsFor=l;s.circ=ims.map(renderCircle);show('b2');
}
let pend=false;
function refreshCirc(){
  const s=slots.b2;
  if(!circleOn||!s.list.length||pend)return;
  pend=true;
  requestAnimationFrame(()=>{pend=false;
    if(s.imsFor===s.list){s.circ=s.ims.map(renderCircle);show('b2')}else buildCirc()});
}
const slots={};
['b1','b2','b4'].forEach(id=>{
  const el=$('#'+id);
  slots[id]={el,img:el.querySelector('img'),cnt:el.querySelector('.cnt'),coin:el.querySelector('.coin'),spin:false,list:[],i:0};
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag')});
  el.addEventListener('dragleave',()=>el.classList.remove('drag'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag');loadImgs(id,e.dataTransfer.files)});
  el.addEventListener('click',()=>{
    const s=slots[id];
    if(!s.list.length){document.querySelector('input[data-slot="'+id+'"]').click();return}
    if(s.list.length>1&&id!=='b1'){s.i=(s.i+1)%s.list.length;show(id)}
  });
});
function show(id){
  const s=slots[id];
  if(!s.list.length){s.el.classList.remove('has','multi');return}
  s.img.src=(id==='b1'&&cleanOn&&s.cleans&&s.cleans[s.list[s.i]?s.i:0])?s.cleans[s.list[s.i]?s.i:0]:(id==='b2'&&circleOn&&s.circ&&s.circ.length===s.list.length)?s.circ[s.i]:(s.list[s.i]||s.list[0]);
  s.el.classList.add('has');
  s.el.classList.toggle('multi',s.list.length>1);
  if(s.cnt)s.cnt.textContent=(s.i+1)+' / '+s.list.length;
}
function loadImgs(id,files){
  const imgs=[...files].filter(f=>f.type.startsWith('image/'));
  if(!imgs.length)return;
  const s=slots[id];
  const limit=id==='b1'?1:imgs.length;
  Promise.all(imgs.slice(0,limit).map(f=>new Promise(r=>{
    const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);
  }))).then(r=>{s.list=id==='b1'&&s.list[1]?[r[0],s.list[1]]:r;s.i=id==='b1'?spk:0;s.circ=null;s.cleans=null;if(id==='b2'&&circleOn)buildCirc();else if(id==='b1'&&cleanOn)buildClean();else show(id)});
}
document.querySelectorAll('input[data-slot]').forEach(inp=>{
  inp.addEventListener('change',()=>{loadImgs(inp.dataset.slot,inp.files);inp.value=''});
});
function updTag(){$('#tag').textContent=spk?$('#nmb').value:$('#nm').value}
$('#nm').addEventListener('input',updTag);$('#nmb').addEventListener('input',updTag);

// Circle crop for box 2
function circUI(){
  $('#cctl').hidden=!circleOn;
  $('#fillctl').hidden=cp.mode!=='fill';
  $('#fitctl').hidden=cp.mode!=='fit';
  $('#fitb').textContent=cp.mode==='fill'?'Crop to fill':'Fit whole image';
}
$('#circ').addEventListener('click',e=>{
  circleOn=!circleOn;
  e.target.setAttribute('aria-pressed',circleOn);
  e.target.textContent='Circle box 2: '+(circleOn?'on':'off');
  circUI();
  const s=slots.b2;
  if(circleOn&&s.list.length){s.circ=null;refreshCirc()}else show('b2');
});
$('#fitb').addEventListener('click',()=>{cp.mode=cp.mode==='fill'?'fit':'fill';circUI();refreshCirc()});
[['zm','zoom'],['ox','ox'],['oy','oy']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{cp[k]=+e.target.value;refreshCirc()}));
$('#bgc').addEventListener('input',e=>{cp.bg=e.target.value;refreshCirc()});
circUI();

// Portrait background cleaner
$('#clean').addEventListener('click',e=>{
  cleanOn=!cleanOn;
  e.target.setAttribute('aria-pressed',cleanOn);
  e.target.textContent='Clean portrait background: '+(cleanOn?'on':'off');
  $('#cleanctl').hidden=!cleanOn;
  if(cleanOn&&slots.b1.list.length)buildClean();else show('b1');
});
$('#ct').addEventListener('input',e=>{cleanT=+e.target.value;refreshClean()});

// Portrait backdrop: a color and/or image sits behind a transparent portrait
const pbg={color:'#101a16',url:null,img:null};
function applyPbg(){
  const el=$('#b1');
  el.style.backgroundColor=pbg.color;
  el.style.backgroundImage=pbg.url?'url('+pbg.url+')':'none';
  el.style.backgroundSize='cover';el.style.backgroundPosition='center';
  $('#pbgclr').hidden=!pbg.url;
}
$('#pbg').addEventListener('input',e=>{pbg.color=e.target.value;applyPbg()});
$('#pbgimg').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!f.type.startsWith('image/'))return;
  const fr=new FileReader();
  fr.onload=()=>{pbg.url=fr.result;const i=new Image();i.onload=()=>{pbg.img=i};i.src=fr.result;applyPbg()};
  fr.readAsDataURL(f);
});
$('#pbgclr').addEventListener('click',()=>{pbg.url=null;pbg.img=null;applyPbg()});

// CRT scanlines on boxes 1, 2 and 4
let crtOn=true,crtI=0.35,bevOn=true;
$('#bevb').addEventListener('click',e=>{
  bevOn=!bevOn;
  $('#stage').classList.toggle('bevel',bevOn);
  e.target.setAttribute('aria-pressed',bevOn);
  e.target.textContent='CRT bevel: '+(bevOn?'on':'off');
});
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function bevelFx(c,r){
  const f=9*S;
  c.save();
  c.beginPath();c.rect(r.x-2,r.y-2,r.w+4,r.h+4);rr(c,r.x,r.y,r.w,r.h,26*S);c.fillStyle=T.bg;c.fill('evenodd');
  const g=c.createLinearGradient(r.x,r.y,r.x+r.w,r.y+r.h);
  g.addColorStop(0,'#4a5256');g.addColorStop(.5,'#2b3032');g.addColorStop(1,'#15181a');
  c.beginPath();rr(c,r.x,r.y,r.w,r.h,26*S);rr(c,r.x+f,r.y+f,r.w-2*f,r.h-2*f,17*S);
  c.fillStyle=g;c.fill('evenodd');
  c.beginPath();rr(c,r.x+f,r.y+f,r.w-2*f,r.h-2*f,17*S);
  c.lineWidth=3;c.strokeStyle='#050606';c.stroke();
  c.clip();

// Spinning coin: the image's own outline is extruded, so any shape or a plain rectangle works
const tints=new WeakMap(),scratch=document.createElement('canvas');
function tintOf(img){
  let t=tints.get(img);
  if(t&&t.src===img.src)return t;
  const k=Math.min(1,512/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
  const mk=col=>{const q=document.createElement('canvas');q.width=w;q.height=h;const g=q.getContext('2d');
    g.drawImage(img,0,0,w,h);g.globalCompositeOperation='source-atop';g.fillStyle=col;g.fillRect(0,0,w,h);return q};
  t={src:img.src,dark:mk('#7a5a10'),light:mk('#d4a62a')};tints.set(img,t);return t;
}
function drawCoin(c,img,x,y,w,h){
  if(!img.naturalWidth)return;
  const D=Math.min(w,h)*0.86,cx=x+w/2,cy=y+h/2,ar=img.naturalWidth/img.naturalHeight;
  const iw=ar>=1?D:D*ar,ih=ar>=1?D/ar:D;
  const th=(performance.now()/1000)/4*Math.PI*2,co=Math.cos(th),si=Math.sin(th),a=Math.abs(co);
  const T=Math.min(iw,ih)*0.035,face=(co>=0?1:-1)*T*si,fw=Math.max(1,iw*a),t=tintOf(img);
  c.save();
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();
  c.ellipse(cx,cy+ih/2+D*0.05,iw*0.3*(0.4+0.6*a),D*0.03,0,0,6.2832);c.fill();
  for(let z=-T;z<=T;z+=1.5)c.drawImage(z>T*0.3?t.light:t.dark,cx+z*si-fw/2,cy-ih/2,fw,ih);
  const sw=Math.ceil(fw),sh=Math.ceil(ih);
  scratch.width=sw;scratch.height=sh;
  const g=scratch.getContext('2d');
  g.drawImage(img,0,0,sw,sh);
  g.globalCompositeOperation='source-atop';
  g.fillStyle='rgba(0,0,0,'+0.55*(1-a)+')';g.fillRect(0,0,sw,sh);
  c.drawImage(scratch,cx+face-fw/2,cy-ih/2,fw,ih);
  c.restore();
}

function level(){
  let t=0;

    analyser.getByteTimeDomainData(data);
    let s=0;for(const v of data){const d=(v-128)/128;s+=d*d}
    t=Math.min(1,Math.sqrt(s/data.length)*5);

function drawScope(c,x,y,w,h){

  c.strokeStyle='rgba('+T.sc+',.12)';c.lineWidth=1;
  c.beginPath();
  for(let i=1;i<10;i++){c.moveTo(w*i/10,0);c.lineTo(w*i/10,h)}
  for(let i=1;i<8;i++){c.moveTo(0,h*i/8);c.lineTo(w,h*i/8)}
  c.stroke();
  c.strokeStyle='rgba('+T.sc+',.3)';
  c.beginPath();c.moveTo(0,h/2);c.lineTo(w,h/2);c.stroke();
  c.lineWidth=Math.max(2,w/500);c.strokeStyle=T.scope;c.shadowColor=T.scope;c.shadowBlur=12;c.lineJoin='round';

}

    for(const id of ['b1','b2','b3','b4']){

    }

  }
  const p=16,g=16,cl=(W-2*p-g)/3.4,cr=cl*2.4,ah=H-2*p-g,x2=p+cl+g;

addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='file')return;
  if(e.key==='h'||e.key==='H')$('#bar').classList.toggle('hidden');
  if(e.key==='1')setSpk(0);if(e.key==='2')setSpk(1);if(e.key==='s'||e.key==='S')setSpk(spk?0:1);
  if(e.key==='f'||e.key==='F')$('#fs').click();
  if(e.key===' '&&!$('#play').disabled){e.preventDefault();$('#play').click()}
});
</script>
</body>
</html>
